org.gradle.jvmargs=-Xmx8G -XX:MaxMetaspaceSize=4G -XX:ReservedCodeCacheSize=512m -XX:+HeapDumpOnOutOfMemoryError
android.useAndroidX=true
# This newDsl flag was added by the Flutter template
android.newDsl=false
# This builtInKotlin flag was added by the Flutter template
android.builtInKotlin=false

# Kotlin's incremental caches use memory-mapped files. On this project's drive
# closing them fails with "Could not close incremental caches" for every module,
# which aborts the build. Full (non-incremental) compilation is slower but
# reliable; remove this if the build ever moves to a different volume.
kotlin.incremental=false
kotlin.incremental.useClasspathSnapshot=false
