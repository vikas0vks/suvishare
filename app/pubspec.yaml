name: suvi_share
description: "Suvi Share — share files, text and media across your Wi-Fi. No cloud, no account."
publish_to: 'none'
version: 0.4.0+7

environment:
  sdk: ^3.13.0

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  cupertino_icons: ^1.0.8
  suvi_core:
    path: ../packages/suvi_core

  # State & navigation
  flutter_riverpod: ^3.4.2
  go_router: ^17.5.0

  # UI
  dynamic_color: ^1.9.0
  flutter_animate: ^4.5.2
  pretty_qr_code: ^3.6.0
  mobile_scanner: ^7.4.0
  intl: any

  # Files & platform
  file_picker: ^12.0.0
  file_selector: ^1.1.0
  desktop_drop: ^0.7.1
  pasteboard: ^0.5.0
  uri_content: ^4.0.1
  path_provider: ^2.1.6
  path: ^1.9.1
  open_filex: ^4.7.0
  url_launcher: ^6.3.2
  share_plus: ^13.3.0

  # Desktop
  window_manager: ^0.5.2
  tray_manager: ^0.5.3

  # Android background & share-sheet
  flutter_foreground_task: ^11.0.0
  flutter_local_notifications: ^22.3.0
  receive_sharing_intent: 1.8.1

  # Device / network / permissions
  device_info_plus: ^13.2.0
  package_info_plus: ^10.2.1
  connectivity_plus: ^7.3.1
  permission_handler: 12.0.3
  wakelock_plus: ^1.7.0

  # Persistence
  shared_preferences: ^2.5.5

  # Misc
  logging: ^1.3.0
  uuid: ^4.6.0
  mime: ^2.0.0
  collection: ^1.19.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  generate: true

  assets:
    - assets/web/
    - assets/icon/

  fonts:
    - family: Manrope
      fonts:
        - asset: assets/fonts/Manrope.ttf
    - family: Inter
      fonts:
        - asset: assets/fonts/Inter.ttf
    - family: NotoSansDevanagari
      fonts:
        - asset: assets/fonts/NotoSansDevanagari.ttf
