name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  android:
    name: Android packages
    runs-on: ubuntu-24.04
    timeout-minutes: 45

    steps:
      - name: Check out source
        uses: actions/checkout@v7

      - name: Set up JDK 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Flutter 3.47.0
        run: |
          git clone --branch 3.47.0 --depth 1 https://github.com/flutter/flutter.git "$RUNNER_TEMP/flutter"
          echo "$RUNNER_TEMP/flutter/bin" >> "$GITHUB_PATH"

      - name: Install Android SDK 36
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" 'platforms;android-36' 'build-tools;36.0.0' >/dev/null

      - name: Restore release signing key
        shell: bash
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          ANDROID_STORE_PASSWORD: ${{ secrets.ANDROID_STORE_PASSWORD }}
        run: |
          set -euo pipefail
          for value in "$ANDROID_KEYSTORE_BASE64" "$ANDROID_KEY_ALIAS" "$ANDROID_KEY_PASSWORD" "$ANDROID_STORE_PASSWORD"; do
            [[ -n "$value" ]] || { echo 'Android signing secrets are not configured.'; exit 1; }
          done
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/suvi-share.jks"
          {
            printf 'storeFile=%s\n' "$RUNNER_TEMP/suvi-share.jks"
            printf 'storePassword=%s\n' "$ANDROID_STORE_PASSWORD"
            printf 'keyAlias=%s\n' "$ANDROID_KEY_ALIAS"
            printf 'keyPassword=%s\n' "$ANDROID_KEY_PASSWORD"
          } > app/android/key.properties

      - name: Build signed Android packages
        working-directory: app
        run: |
          flutter pub get
          flutter gen-l10n
          flutter build apk --release --split-per-abi --obfuscate --split-debug-info=build/symbols/android
          flutter build apk --release --obfuscate --split-debug-info=build/symbols/android
          flutter build appbundle --release --obfuscate --split-debug-info=build/symbols/android

      - name: Stage Android artifacts
        shell: bash
        run: |
          set -euo pipefail
          VERSION="$(sed -n 's/^version: *\([^+]*\).*/\1/p' app/pubspec.yaml)"
          mkdir -p release/android
          cp app/build/app/outputs/flutter-apk/app-arm64-v8a-release.apk "release/android/SuviShare-$VERSION-android-arm64.apk"
          cp app/build/app/outputs/flutter-apk/app-armeabi-v7a-release.apk "release/android/SuviShare-$VERSION-android-arm32.apk"
          cp app/build/app/outputs/flutter-apk/app-x86_64-release.apk "release/android/SuviShare-$VERSION-android-x86_64.apk"
          cp app/build/app/outputs/flutter-apk/app-release.apk "release/android/SuviShare-$VERSION-android-universal.apk"
          cp app/build/app/outputs/bundle/release/app-release.aab "release/android/SuviShare-$VERSION-android.aab"

      - name: Upload Android artifacts
        uses: actions/upload-artifact@v7
        with:
          name: android
          path: release/android/*
          if-no-files-found: error

  windows:
    name: Windows installer
    runs-on: windows-2022
    timeout-minutes: 45

    steps:
      - name: Check out source
        uses: actions/checkout@v7

      - name: Install Flutter 3.47.0
        shell: pwsh
        run: |
          git clone --branch 3.47.0 --depth 1 https://github.com/flutter/flutter.git "$env:RUNNER_TEMP/flutter"
          "$env:RUNNER_TEMP/flutter/bin" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append

      - name: Install Inno Setup
        shell: pwsh
        run: choco install innosetup --no-progress -y

      - name: Build Windows installer
        shell: pwsh
        run: ./packaging/windows/build.ps1 -FlutterPath "$env:RUNNER_TEMP/flutter/bin/flutter.bat"

      - name: Stage Windows artifact
        shell: pwsh
        run: |
          $version = ((Select-String -Path app/pubspec.yaml -Pattern '^version:').Line -replace '^version:\s*', '').Split('+')[0]
          New-Item -ItemType Directory -Force release/windows | Out-Null
          Copy-Item "packaging/windows/output/SuviShare-$version-windows-x64-setup.exe" release/windows/

      - name: Upload Windows artifact
        uses: actions/upload-artifact@v7
        with:
          name: windows
          path: release/windows/*
          if-no-files-found: error

  linux:
    name: Linux packages
    runs-on: ubuntu-24.04
    timeout-minutes: 45

    steps:
      - name: Check out source
        uses: actions/checkout@v7

      - name: Install desktop build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y clang cmake ninja-build pkg-config libgtk-3-dev liblzma-dev libayatana-appindicator3-dev libsecret-1-dev

      - name: Install Flutter 3.47.0
        run: |
          git clone --branch 3.47.0 --depth 1 https://github.com/flutter/flutter.git "$RUNNER_TEMP/flutter"
          echo "$RUNNER_TEMP/flutter/bin" >> "$GITHUB_PATH"

      - name: Build Linux packages
        run: bash packaging/linux/build.sh "$RUNNER_TEMP/flutter/bin"

      - name: Stage Linux artifacts
        shell: bash
        run: |
          set -euo pipefail
          VERSION="$(sed -n 's/^version: *\([^+]*\).*/\1/p' app/pubspec.yaml)"
          mkdir -p release/linux
          cp "packaging/linux/output/suvi-share_${VERSION}_amd64.deb" "release/linux/SuviShare-$VERSION-linux-amd64.deb"
          cp "packaging/linux/output/SuviShare-$VERSION-linux-x64.tar.gz" release/linux/

      - name: Upload Linux artifacts
        uses: actions/upload-artifact@v7
        with:
          name: linux
          path: release/linux/*
          if-no-files-found: error

  publish:
    name: Publish GitHub release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [android, windows, linux]
    runs-on: ubuntu-24.04
    timeout-minutes: 15

    steps:
      - name: Download release artifacts
        uses: actions/download-artifact@v8
        with:
          path: release
          merge-multiple: true

      - name: Generate checksums
        working-directory: release
        run: sha256sum * > SHA256SUMS.txt

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          gh release create "$GITHUB_REF_NAME" release/* --repo "$GITHUB_REPOSITORY" --verify-tag --generate-notes --title "Suvi Share $VERSION"
