<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="300" viewBox="0 0 1200 300" role="img" aria-labelledby="title description">
  <title id="title">Suvi Share transfer flow</title>
  <desc id="description">A sender discovers a receiver over the local network, the receiver approves, and encrypted file data streams directly between them.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#081a22"/>
      <stop offset="1" stop-color="#10293a"/>
    </linearGradient>
    <linearGradient id="line" gradientUnits="userSpaceOnUse" x1="0" y1="0" x2="1200" y2="0">
      <stop offset="0" stop-color="#22cbb2"/>
      <stop offset="1" stop-color="#8b7cff"/>
    </linearGradient>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M0 0 10 5 0 10Z" fill="#7d8df0"/>
    </marker>
  </defs>
  <rect width="1200" height="300" rx="24" fill="url(#bg)"/>

  <g font-family="Inter,Segoe UI,Arial,sans-serif">
    <g transform="translate(70 52)">
      <rect width="220" height="196" rx="22" fill="#0d3035" stroke="#23746a" stroke-width="2"/>
      <rect x="67" y="24" width="86" height="104" rx="13" fill="none" stroke="#58dfca" stroke-width="5"/>
      <circle cx="110" cy="110" r="4" fill="#58dfca"/>
      <text x="110" y="158" fill="#effffc" font-size="20" font-weight="700" text-anchor="middle">Sender</text>
      <text x="110" y="181" fill="#78aaa5" font-size="13" text-anchor="middle">Choose and prepare</text>
    </g>

    <g transform="translate(490 40)">
      <circle cx="110" cy="84" r="70" fill="#182c42" stroke="#4b5d8e" stroke-width="2"/>
      <circle cx="110" cy="84" r="48" fill="none" stroke="#7082cc" stroke-width="2" stroke-dasharray="5 8"/>
      <path d="M74 86c20-20 52-20 72 0M88 102c12-12 32-12 44 0" fill="none" stroke="#a59aff" stroke-width="6" stroke-linecap="round"/>
      <circle cx="110" cy="118" r="7" fill="#a59aff"/>
      <text x="110" y="181" fill="#effffc" font-size="20" font-weight="700" text-anchor="middle">Local network</text>
      <text x="110" y="204" fill="#8598ba" font-size="13" text-anchor="middle">No cloud relay</text>
    </g>

    <g transform="translate(910 52)">
      <rect width="220" height="196" rx="22" fill="#172a42" stroke="#5569a2" stroke-width="2"/>
      <rect x="57" y="34" width="106" height="80" rx="11" fill="none" stroke="#a59aff" stroke-width="5"/>
      <path d="M92 75l13 13 27-31" fill="none" stroke="#a59aff" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/>
      <text x="110" y="158" fill="#effffc" font-size="20" font-weight="700" text-anchor="middle">Receiver</text>
      <text x="110" y="181" fill="#8f9fc6" font-size="13" text-anchor="middle">Approve and save</text>
    </g>

    <path d="M310 118H470" fill="none" stroke="url(#line)" stroke-width="4" stroke-linecap="round" marker-end="url(#arrow)"/>
    <text x="390" y="99" fill="#7db4af" font-size="12" font-weight="700" text-anchor="middle" letter-spacing="1">DISCOVER</text>
    <path d="M730 118H890" fill="none" stroke="url(#line)" stroke-width="4" stroke-linecap="round" marker-end="url(#arrow)"/>
    <text x="810" y="99" fill="#919bd0" font-size="12" font-weight="700" text-anchor="middle" letter-spacing="1">APPROVE</text>
    <text x="600" y="264" fill="#8cd9ce" font-size="12" font-weight="700" text-anchor="middle" letter-spacing="1">ENCRYPTED DIRECT STREAM</text>
    <path d="M310 275H890" fill="none" stroke="url(#line)" stroke-width="4" stroke-linecap="round" marker-end="url(#arrow)"/>
  </g>
</svg>
